name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: python -c "import xml.etree.ElementTree as E; E.parse('assets/qwen38-5090-performance-poster.svg')"
      - run: python -c "from pathlib import Path; bad=[str(p) for p in Path('scripts').glob('*.sh') if b'\r\n' in p.read_bytes()]; assert not bad, bad"
      - run: |
          set +e
          git grep -n -i -E '(hf_[a-z0-9]{20,}|api[_-]?key[[:space:]]*=|password[[:space:]]*=|C:\\Users\\Kyle|/root/src/sglang-bounded-dflash)' -- ':!tests/**' ':!.github/workflows/ci.yml'
          status=$?
          set -e
          case "$status" in
            0) echo "secret or personal path match found" >&2; exit 1 ;;
            1) echo "tracked secret/path scan passed" ;;
            *) echo "git grep failed with $status" >&2; exit "$status" ;;
          esac

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path windows/Install-Desktop-Launchers.ps1),
            [ref] $null,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object ToString; exit 1 }
      - shell: powershell
        run: |
          . ./windows/Install-Desktop-Launchers.ps1
          $a = Resolve-WslRepositoryPath -RepositoryWindowsPath '\\wsl$\Ubuntu\home\qwen' -Distro Ubuntu
          $b = Resolve-WslRepositoryPath -RepositoryWindowsPath '\\wsl.localhost\Ubuntu\home\qwen' -Distro Ubuntu
          if ($a -ne '/home/qwen' -or $b -ne '/home/qwen') { exit 1 }
          try {
            Resolve-WslRepositoryPath -RepositoryWindowsPath '\\wsl$\Other\home\qwen' -Distro Ubuntu
            exit 1
          } catch {
            if ($_.Exception.Message -notlike 'Distro does not match*') { throw }
          }
